# Push to main -> the private Hugging Face Space is replaced with this commit and rebuilt.
# Needs: repository secret HF_TOKEN (Hugging Face token with write access to the Space)
#        repository variable HF_SPACE (e.g. "my-org/kidsai")
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-huggingface
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the Space (tracked files + Space Dockerfile and README)
        run: |
          mkdir -p "$RUNNER_TEMP/space"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/space"
          cp deploy/huggingface/Dockerfile "$RUNNER_TEMP/space/Dockerfile"
          cp deploy/huggingface/README.md "$RUNNER_TEMP/space/README.md"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          pip install --quiet "huggingface_hub>=0.30"
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              folder_path=os.path.join(os.environ["RUNNER_TEMP"], "space"),
              delete_patterns="*",  # files removed from git are removed from the Space too
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]}",
          )
          EOF
